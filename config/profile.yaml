# ---------------------------------------------------------------------------
# LMIC weighting.
#
# Two independent things, scored separately.
#
#   duty_station  the job is physically based in a low, lower-middle or
#                 upper-middle income country, per the World Bank
#                 classification fetched fresh each run.
#   focus         the WORK is about low- and middle-income settings, wherever
#                 it sits. A research associate post at LSHTM on TB in Malawi
#                 is LMIC work done from London, and scoring only by duty
#                 station would bury the entire European PhD route.
#
# A job can have both, and the points stack.
# ---------------------------------------------------------------------------
lmic_weights:
  duty_station: 25
  focus: 18
  by_group:
    LIC: 10          # low income
    LMC: 8           # lower-middle income
    UMC: 3           # upper-middle income
    HIC: 0           # high income

