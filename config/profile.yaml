# ---------------------------------------------------------------------------
# EXCLUDE: a posting matching one of these is rejected EVEN IF it passed the
# gate, unless it also carries an unambiguous public health term (the list in
# STRONG_HEALTH_PATTERNS in pipeline/classify.py).
#
# This exists because the gate has to accept "medical", "laboratory",
# "infectious" and "disease" or it drops half of what you want, and those same
# words wave through bench science. The jobRxiv feeds were delivering cancer
# bioinformatics and structural biology postdocs. A genomic epidemiology post
# about TB transmission still gets through, because it says epidemiology.
# ---------------------------------------------------------------------------
exclude_terms:
  - molecular biology
  - structural biology
  - crystallograph
  - cryo-em
  - protein structure
  - protein engineering
  - biochemistry
  - biophysics
  - synthetic biology
  - stem cell
  - organoid
