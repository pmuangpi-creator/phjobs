# The pinned panel at the top of the doctoral page: routes already being worked.
#
# Hand-kept on purpose. Nothing here is fetched, scored or expired, so it holds
# routes with no advert to fetch: a central doctoral application with no
# deadline, a funding scheme, a supervisor who has been written to.
#
# THIS FILE GOES STALE IF NOBODY EDITS IT. It did: between 5 September and
# 2 October 2026 the panel still showed two 15 September deadlines as live and
# still listed Denkinger as an open Heidelberg lead after she had declined. If
# you would rather the panel followed the PhD Board sheet automatically, set
# pipeline_source in config/phd.yaml and these rows become the fallback only.
#
# FIELDS
#   status          action | sent | watching | closed
#                     action    something is due from you
#                     sent      with them, waiting on a reply
#                     watching  call not open yet, or no date published
#                     closed    finished, kept for the record
#   deadline        YYYY-MM-DD, or blank where none is published
#   date_confidence confirmed | inferred | none
#   funding         salaried | stipend | partial | unfunded | unstated
#   affiliation     true when the route needs an employer at home to release you
#   next_action     the single next thing
#
# Last reviewed 2 October 2026. Confirm every date on the institution's own page
# before planning around it.

