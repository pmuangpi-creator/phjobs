# The pinned panel at the top of the doctoral page: routes already being worked.
#
# Hand-kept on purpose. These are here because a decision was made about them,
# not because a feed mentioned them, and several have no advert to fetch at all
# (the Heidelberg central route publishes no vacancy; DAAD is a funding scheme,
# not a post). Nothing in this file is fetched, scored or expired. Edit it when
# something moves and the page follows on the next run.
#
# FIELDS
#   status          action | sent | watching | closed
#                     action    something is due from you
#                     sent      with them, waiting on a reply
#                     watching  call not open yet, or no date published
#                     closed    finished, kept for the record
#   deadline        YYYY-MM-DD, or blank where none is published
#   date_confidence confirmed | inferred | none
#                     inferred means the date is a pattern from a previous
#                     cycle, not something the institution has published. The
#                     page labels these so they are never mistaken for a fact.
#   funding         salaried | stipend | partial | unfunded | unstated
#   affiliation     true when the route needs an employer at home to release you
#   next_action     the single next thing, in your words
#
# The dates below were confirmed at the time they were entered. Confirm every
# one on the institution's own page before you rely on it.

