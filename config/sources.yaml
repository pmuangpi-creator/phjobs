# Source registry.
#
# Rewritten after the first live run. Every entry below is either confirmed
# working from that run's source-health report, or verified by fetching it and
# seeing actual feed content. The speculative list this file started with has
# been deleted; what it returned is recorded at the bottom under GRAVEYARD so
# nobody re-adds a dead source six months from now.
#
# ADDING A SOURCE
#   Greenhouse: careers page at job-boards.greenhouse.io/foo -> token "foo"
#   Lever:      careers page at jobs.lever.co/bar            -> company "bar"
#   Workday:    careers page at tenant.wdN.myworkdayjobs.com/SITE
#               -> host "tenant.wdN.myworkdayjobs.com", tenant "tenant", site "SITE"
#   RSS:        view the source of a search-results page and look for
#               <link type="application/rss+xml">
#
# assume_health: true waives the public-health relevance gate for a source.
# Use it only for organisations whose entire output is health work and whose
# API gives titles without descriptions. The negative weights in profile.yaml
# still push finance, IT and logistics roles to the bottom.

# ---------------------------------------------------------------------------
# ReliefWeb -- DISABLED BY REQUEST, but read this before deleting it.
#
# It is the largest single source of NGO, INGO and UN health vacancies, and it
# has never had one successful run here. The only time it was called, it hit the
# retired v1 endpoint and returned 410 Gone. The config now points at v2 and has
# not been tried. Turning enabled back to true is a one-word change and costs
# nothing to test: if it works you gain several hundred listings and the UN
# coverage the board is currently missing, and if it fails it logs an error and
# contributes zero.
#
# Free and key-free.
#
# READ THIS IF RELIEFWEB STOPS WORKING: the v1 endpoint was decommissioned and
# answers 410 Gone. v2 is documented as fully compatible. Since 1 November 2025
# ReliefWeb also asks that appname be pre-approved. Request one through the form
# linked from https://apidoc.reliefweb.int/parameters -- the pattern they ask
# for is organisation name plus purpose plus random characters -- then put it
# below. Until then this uses a self-descriptive name, which may or may not be
# accepted.
# ---------------------------------------------------------------------------
reliefweb:
  enabled: false          # <-- turned off by request. Set to true to bring back.
  appname: phjobs-publichealth-aggregator
  endpoint: https://api.reliefweb.int/v2/jobs
  max_pages: 4
  page_size: 500

# ---------------------------------------------------------------------------
# Greenhouse. Only the three tokens that actually answered survive.
# ---------------------------------------------------------------------------
greenhouse:
  enabled: true
  boards:
    - dimagi              # confirmed: returned postings
    - onecampaign         # confirmed: returned postings
    - resolvetosavelives  # confirmed: returned postings

# ---------------------------------------------------------------------------
# Lever. Every candidate 404'd. Kept as an empty, working hook.
# ---------------------------------------------------------------------------
lever:
  enabled: true
  companies:
    - wr          # World Relief -- verified, one Africa-region role covering
                  # Chad, Burundi, Ethiopia, DRC, Malawi, Kenya, Rwanda, Haiti
    - ghcorps     # Global Health Corps -- endpoint valid, returned [] when
                  # checked. Costs one request; keep and see.

# ---------------------------------------------------------------------------
# BambooHR. IDinsight verified: 18 postings across Shillong, Lucknow, Manila,
# Jakarta, Dakar, Nairobi, Lusaka. Exactly the LMIC field profile.
# ---------------------------------------------------------------------------
bamboohr:
  enabled: true
  accounts:
    - sub: idinsight
      org: IDinsight
      assume_health: false   # they do education and agriculture too; let the
                             # gate do its job here

# ---------------------------------------------------------------------------
# Workable. Evidence Action verified: 9 postings across India, Kenya, Nigeria,
# Uganda. Note the account slug is evidence-action with a hyphen; the
# unhyphenated one is a stale duplicate returning zero.
# ---------------------------------------------------------------------------
workable:
  enabled: true
  accounts:
    - account: evidence-action
      org: Evidence Action
      assume_health: false
    - account: villagereach
      org: VillageReach
      assume_health: true    # health logistics organisation; their own site
                             # lists DRC roles the widget did not return, so
                             # this may need the second account slug found

# ---------------------------------------------------------------------------
# Workday. Where the large global health employers actually are.
# Verified by visiting each careers page and reading the portal URL.
# ---------------------------------------------------------------------------
workday:
  enabled: true
  sites:
    - name: PATH
      org: PATH
      host: path.wd1.myworkdayjobs.com
      tenant: path
      site: External
      assume_health: true
      max_results: 200
    - name: FHI 360
      org: FHI 360
      host: fhi.wd1.myworkdayjobs.com
      tenant: fhi
      site: FHI_360_External_Career_Portal
      assume_health: true
      max_results: 200
    - name: Management Sciences for Health
      org: Management Sciences for Health
      host: msh.wd503.myworkdayjobs.com
      tenant: msh
      site: External
      assume_health: true
      max_results: 200

# ---------------------------------------------------------------------------
# SmartRecruiters -- DISABLED, and this one is awkward.
#
# The adapter works and the tokens are right: HealthXPartners is PSI (the name
# looks wrong, it is correct) and AmrefHealthAfrica4 is Amref Health Africa,
# whose entire board is Nairobi, Dar es Salaam and Lusaka. Both are squarely
# what this board is for.
#
# But api.smartrecruiters.com publishes a robots.txt that disallows automated
# retrieval. unjobs.org was excluded on exactly that basis, and applying the
# rule to one source and not another because the second one has jobs I want is
# not a rule. So it is off.
#
# If you decide the API host's posture is acceptable, flip enabled to true.
# The public front end at careers.smartrecruiters.com fetches fine and is not
# disallowed, so a page-parsing adapter would be another way through.
# ---------------------------------------------------------------------------
smartrecruiters:
  enabled: false
  companies:
    - company: HealthXPartners
      org: Population Services International
      assume_health: true
    - company: AmrefHealthAfrica4
      org: Amref Health Africa
      assume_health: true

# ---------------------------------------------------------------------------
# RSS. Each of these was fetched and returned parseable entries.
# ---------------------------------------------------------------------------
rss:
  enabled: true
  feeds:
    # -- jobRxiv category feeds. The site-wide /feed/ returns nothing; the
    #    category feeds work.
    - name: jobRxiv PhD
      url: https://jobrxiv.org/job-category/phd/feed/
      default_category: phd
      enabled: true
    - name: jobRxiv postdoc
      url: https://jobrxiv.org/job-category/postdoc/feed/
      default_category: research
      enabled: true
    - name: jobRxiv research assistant
      url: https://jobrxiv.org/job-category/res-assis/feed/
      default_category: research
      enabled: true
    - name: jobRxiv scientist
      url: https://jobrxiv.org/job-category/scientist/feed/
      default_category: research
      enabled: true
    - name: jobRxiv faculty
      url: https://jobrxiv.org/job-category/faculty/feed/
      default_category: research
      enabled: true

    # -- jobRxiv keyword search feeds (WordPress ?s=TERM&feed=rss2).
    #    WordPress search is loose OR-matching, not phrase matching, so these
    #    are a recall stream: expect noise, and let the relevance gate earn its
    #    keep. Other jobRxiv category slugs, if you want them: res-tech,
    #    manager, bioinfo, director, eng.
    - name: jobRxiv search epidemiology
      url: https://jobrxiv.org/?s=epidemiology&feed=rss2
      default_category: research
      enabled: true
    - name: jobRxiv search public health
      url: https://jobrxiv.org/?s=public+health&feed=rss2
      default_category: research
      enabled: true
    - name: jobRxiv search global health
      url: https://jobrxiv.org/?s=global+health&feed=rss2
      default_category: research
      enabled: true
    - name: jobRxiv search infectious disease
      url: https://jobrxiv.org/?s=infectious+disease&feed=rss2
      default_category: research
      enabled: true

    # -- NGO Jobs in Africa. The single best LMIC-duty-station source found.
    #    Country feeds follow /job-location/<slug>/feed/ and the site's own
    #    index at /rss-feed-by-country/ lists about sixty slugs, all African.
    #    robots.txt is permissive. The four below were fetched and returned
    #    real vacancies; add more slugs freely, they cost one request each.
    #    Note /global/feed/ and /india/feed/ are valid but empty: the site is
    #    Africa-only in practice.
    - name: NGO Jobs Africa Kenya
      url: https://ngojobsinafrica.com/job-location/kenya/feed/
      default_category: ngo
      enabled: true
    - name: NGO Jobs Africa Nigeria
      url: https://ngojobsinafrica.com/job-location/nigeria/feed/
      default_category: ngo
      enabled: true
    - name: NGO Jobs Africa Tanzania
      url: https://ngojobsinafrica.com/job-location/tanzania/feed/
      default_category: ngo
      enabled: true
    - name: NGO Jobs Africa Ethiopia
      url: https://ngojobsinafrica.com/job-location/ethiopia/feed/
      default_category: ngo
      enabled: true
    - name: NGO Jobs Africa Uganda
      url: https://ngojobsinafrica.com/job-location/uganda/feed/
      default_category: ngo
      enabled: true
    - name: NGO Jobs Africa South Sudan
      url: https://ngojobsinafrica.com/job-location/south-sudan/feed/
      default_category: ngo
      enabled: true
    - name: NGO Jobs Africa Malawi
      url: https://ngojobsinafrica.com/job-location/malawi/feed/
      default_category: ngo
      enabled: true
    - name: NGO Jobs Africa Zambia
      url: https://ngojobsinafrica.com/job-location/zambia/feed/
      default_category: ngo
      enabled: true

    # -- KEMRI-Wellcome Trust Research Programme, Kilifi and Nairobi.
    #    Live Drupal feed, verified.
    - name: KEMRI-Wellcome
      url: https://jobs.kemri-wellcome.org/rss.xml
      default_category: research
      enabled: true

    # -- LSHTM. Small feeds, but the hit rate for this profile is high.
    #    The index at https://jobs.lshtm.ac.uk/RSS/ lists ~50 more feeds
    #    following the same rss.aspx?cat=N&type=N pattern.
    - name: LSHTM all vacancies
      url: https://jobs.lshtm.ac.uk/RSS/rss.aspx
      default_category: research
      enabled: true
    - name: LSHTM epidemiology and population health
      url: https://jobs.lshtm.ac.uk/RSS/rss.aspx?cat=200&type=8
      default_category: research
      enabled: true
    - name: LSHTM infectious and tropical diseases
      url: https://jobs.lshtm.ac.uk/RSS/rss.aspx?cat=201&type=8
      default_category: research
      enabled: true
    - name: LSHTM public health and policy
      url: https://jobs.lshtm.ac.uk/RSS/rss.aspx?cat=202&type=8
      default_category: research
      enabled: true

    # -- MRC units in The Gambia and Uganda hire through LSHTM. Both feeds are
    #    well-formed with the right channel titles but carried zero items when
    #    checked, so they are real endpoints that have not been seen to deliver.
    #    They cost one request each; leave them and watch.
    - name: LSHTM MRC The Gambia
      url: https://jobs.lshtm.ac.uk/RSS/rss.aspx?cat=267&type=6
      default_category: research
      enabled: true
    - name: LSHTM MRC Uganda
      url: https://jobs.lshtm.ac.uk/RSS/rss.aspx?cat=268&type=6
      default_category: research
      enabled: true

# ---------------------------------------------------------------------------
# Listing pages with no feed of any kind.
#
# Every employer below was confirmed to carry real LMIC vacancies, and none of
# them publishes RSS, Atom or JSON. Rather than nine parsers written against
# markup nobody has inspected, fetch/pagefetch.py harvests the links on each
# page, keeps the ones that read like job titles, and lets the relevance gate
# do the rest. Noisier than a bespoke parser, far harder to break.
#
# If a source reports "no links looked like vacancies", run
#     python3 run_refresh.py --discover <url>
# and put the resulting URL shape in link_pattern.
# ---------------------------------------------------------------------------
pages:
  enabled: true
  sites:
    - name: Last Mile Health
      org: Last Mile Health
      url: https://lastmilehealth.applytojob.com/apply
      link_pattern: "/apply/[A-Za-z0-9]+/"
      default_category: ngo
      assume_health: true
      enabled: true
    - name: Living Goods
      org: Living Goods
      url: https://livinggoods.applytojob.com/apply
      link_pattern: "/apply/[A-Za-z0-9]+/"
      default_category: ngo
      assume_health: true
      enabled: true
    - name: OUCRU
      org: Oxford University Clinical Research Unit
      url: https://www.oucru.org/career/
      default_category: research
      assume_health: true
      enabled: true
    - name: Ifakara Health Institute
      org: Ifakara Health Institute
      url: https://ihi.or.tz/our-job-posts/
      country: Tanzania
      default_category: research
      assume_health: true
      enabled: true
    - name: icddr,b
      org: icddr,b
      url: https://career.icddrb.org/
      country: Bangladesh
      city: Dhaka
      default_category: research
      assume_health: true
      enabled: true
    - name: ICMR
      org: Indian Council of Medical Research
      url: https://recruitment.icmr.org.in/
      country: India
      default_category: research
      assume_health: true
      enabled: true
    - name: DevNetJobsIndia
      org: ""
      url: https://www.devnetjobsindia.org/
      country: India
      default_category: ngo
      assume_health: false     # general development board, let the gate filter
      max_links: 120
      enabled: true
    - name: Aga Khan University
      org: Aga Khan University
      url: https://www.aku.edu/vacancies/Pages/home.aspx
      default_category: research
      assume_health: true
      enabled: true
    - name: APHRC
      org: African Population and Health Research Center
      url: https://aphrc.org/careers/
      enabled: false           # robots.txt blocks automated retrieval outright,
                               # naming ClaudeBot and GPTBot. Left here disabled
                               # so nobody re-adds it without reading this.

# ---------------------------------------------------------------------------
# Fetch the actual posting page for listings that arrived as a two-line snippet.
# Only postings not seen on a previous run are fetched, so the steady state is
# a handful of requests, not one per listing per run.
# ---------------------------------------------------------------------------
full_descriptions:
  enabled: true
  max_per_run: 120

# ---------------------------------------------------------------------------
# Calendar feed, published at docs/data/deadlines.ics. Subscribe to it once by
# URL in Google Calendar and every refresh updates it.
# ---------------------------------------------------------------------------
calendar:
  enabled: true
  min_score: 20        # do not clutter the calendar with weak matches
  horizon_days: 120

# ---------------------------------------------------------------------------
# Digest. run_refresh.py writes the text; the GitHub Actions workflow decides
# how it reaches you. That split keeps credentials out of this repository.
# ---------------------------------------------------------------------------
alerts:
  enabled: true
  min_score: 30        # a listing must score at least this to be worth telling you about
  closing_days: 3
  site_url: https://pmuangpi-creator.github.io/phjobs/

expire_after_days: 2
stale_after_days: 45

# ---------------------------------------------------------------------------
# GRAVEYARD -- checked, do not re-add without new evidence
#
# ReliefWeb v1 (api.reliefweb.int/v1/jobs)  410 Gone, decommissioned. Use v2.
# unjobs.org                                NOT ADDED, and this was a judgement
#                                           call rather than a technical one.
#                                           Their robots.txt disallows automated
#                                           retrieval, including the feed paths
#                                           and the robots.txt file itself. A
#                                           polling job is exactly what that
#                                           rule refuses. Adding it would mean
#                                           ignoring the site's stated wishes.
#                                           For the UN vacancies it carries, use
#                                           ReliefWeb above, or an adapter
#                                           against the agencies' own boards.
# THE Unijobs                               a real feed exists at
#                                           /unijobs/jobsrss/?countrycode=GB but
#                                           robots.txt disallows polling it.
# EURAXESS                                  no RSS and no public API. The search
#                                           page offers neither. Only paid
#                                           third-party scrapers exist.
# Nature Careers                            the old Naturejobs RSS is retired;
#                                           the current path returns HTML.
# Academic Positions                        no feed offered.
# jobs.ac.uk                                RSS definitely exists -- the index
#                                           at jobs.ac.uk/feeds lists six
#                                           health feeds and 14 location feeds
#                                           -- but the link targets could not be
#                                           read remotely and every inferred URL
#                                           404'd. Open
#                                           jobs.ac.uk/feeds/subject-areas/health-and-medical
#                                           in a browser, copy the href of one
#                                           "RSS Feed" link, and that single URL
#                                           gives the pattern for all twenty.
# jobrxiv.org/feed/                         site-wide feed returns 0 entries.
# Greenhouse tokens                         clintonhealthaccessinitiative, path,
#                                           vitalstrategies, pih, evidenceaction,
#                                           lastmilehealth, villagereach,
#                                           livinggoods, jhpiego, fhi360,
#                                           populationservicesinternational,
#                                           idinsight, partnersinhealth,
#                                           nooraheath -- all 404. None of these
#                                           organisations use Greenhouse.
# Lever tokens                              ihi, d-tree, medicmobile,
#                                           nothingbutnets, zipline -- all 404.
# intrahealth.breezy.hr                     name collision: that board belongs
#                                           to IntraHealth Technologies, a
#                                           Canadian health-IT firm, not
#                                           IntraHealth International.
# Devex, Impactpool, LinkedIn, Indeed       subscription or terms of service
#                                           prohibit automated access.
# findaphd                                  no feed; terms unconfirmed, assume
#                                           prohibited.
#
# --- second sweep, LMIC-focused ---
# APHRC (Nairobi)                           robots.txt names and blocks
#                                           ClaudeBot, GPTBot, anthropic-ai and
#                                           CCBot outright, and disallows feed
#                                           URLs for everyone. Excluded.
# jobs.undp.org/cj_rss_feed.cfm             a real UNDP RSS feed, disallowed by
#                                           their robots.txt. Excluded.
# api.smartrecruiters.com                   robots-disallowed. See the disabled
#                                           block above.
# Impactpool                                browsing is free and robots.txt is
#                                           permissive, but there is no feed and
#                                           no API. Scraping only, so no.
# Devex                                     no public API, /api/ disallowed,
#                                           paywall status unclear.
# devjobsmail.com                           403.
# oneacrefund.org                           43 vacancies, all self-hosted Drupal
#                                           pages, no feed and no ATS.
# careers.who.int                           Taleo. UI advertises RSS but the
#                                           documented parameter returns HTML.
# nimr.or.tz                                TLS failure, self-signed cert.
# research.pasteur.fr/en/jobs/feed          valid RSS, zero items, Paris-based.
# iddo.org, hub.tghn.org                    abandoned boards, stale listings.
# pihhealth.org                             NAME COLLISION: that is PIH Health,
#                                           a California hospital system, not
#                                           Partners In Health. Never ingest it.
# intrahealth.breezy.hr                     same trap, different org.
# Lever 404s                                idinsight, oneacrefund,
#                                           evidenceaction, livinggoods,
#                                           mercycorps.
# Greenhouse 404s                           villagereach, medic.
#
# HTML-ONLY, real jobs, would need page parsing rather than a feed:
#   Last Mile Health and Living Goods (JazzHR, no public RSS) -- Ethiopia,
#   Liberia, Malawi, Ghana, Sierra Leone, Burkina Faso, Kenya
#   OUCRU (self-hosted) -- Vietnam, Indonesia, Nepal
#   Ifakara Health Institute -- Tanzania
#   icddr,b -- Dhaka
#   ICMR -- India
#   DevNetJobsIndia -- India, robots.txt permissive
#   Aga Khan University (Taleo, aku.taleo.net) -- Pakistan, Kenya, Uganda,
#   Tanzania, Afghanistan
#
# KNOWN COVERAGE GAP: Latin America. Nothing verified reaches it. The African
# country feeds are Africa-only by construction and Asian coverage is three
# single-employer sources. ReliefWeb would close both gaps at once.
#
# ALSO WORTH DOING: University of Oxford exposes a real vacancy XML API at
#   my.corehr.com/pls/uoxrecruit/Erq_search_xml_api.build_search_xml
#     ?p_internal_external=A&p_company=10&p_department=B9
#   (B9 is the Centre for Tropical Medicine and Global Health). It is XML but
#   not RSS, so feedparser will not read it and it needs its own small adapter.
#   Note that MORU Bangkok and OUCRU Ho Chi Minh City post locally rather than
#   through Oxford, so this yields the UK-based network roles only.
#
# NOT YET WRITTEN -- these need bespoke adapters and are mostly JS-rendered:
#   CHAI and Jhpiego (iCIMS), Vital Strategies (Taleo, org VITASTRA),
#   IntraHealth International (UKG/UltiPro), Population Council (Paylocity),
#   Abt Global (Oracle Fusion, site JoinAbt), Palladium (Cornerstone),
#   JSI (in-house), Partners In Health (no third-party ATS found).
# ---------------------------------------------------------------------------
