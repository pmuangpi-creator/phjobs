name: Refresh jobs

on:
  schedule:
    # Four times a day, UTC. 01:00 UTC is 08:00 in Bangkok, so the morning run
    # has finished by the time you open the page.
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:        # the "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "config/**"
      - "fetch/**"
      - "pipeline/**"
      - "run_refresh.py"

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # the digest is delivered as an issue; see the last step

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Raised from 25 when the sitemap sources arrived. AcademicTransfer asks for
    # ten seconds between requests and the run honours that, so the first refresh
    # after a batch of new doctoral listings is slow. Steady state is minutes.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Offline, seconds, no network.
      #
      # continue-on-error, and the reason matters. These used to block the
      # fetch, on the argument that a broken classifier should not publish a
      # board of mislabelled funding. The argument was half right and the
      # implementation was wrong: on 7 October 2026 a single assertion started
      # failing because a deadline in config/phd_pipeline.yaml had passed, and
      # the board stopped refreshing for six days while GitHub sent "All jobs
      # have failed" every six hours.
      #
      # So the order is now: run the checks, fetch anyway, commit anyway, and
      # fail the run at the very end if the checks failed. A red run still
      # tells you something is wrong. It no longer stops you finding out what
      # closed this week.
      - name: Check the pipeline logic
        id: checks
        continue-on-error: true
        run: |
          python selftest.py
          python tests_doctoral.py

      - name: Fetch and rebuild the board
        run: python run_refresh.py -v

      - name: Report source health in the run summary
        if: always()
        run: |
          echo "## Source health" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat docs/data/sources_status.json >> $GITHUB_STEP_SUMMARY || echo "{}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Config going out of date is a notice, not a build failure. This is where
      # it says so: entries in config/phd_pipeline.yaml whose deadline has
      # passed, inferred dates that need confirming, anything marked as needing
      # you with no next action written down.
      - name: Report panel housekeeping in the run summary
        if: always()
        run: |
          echo "## Your doctoral panel" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("docs/data/phd.json")
          warnings = []
          if p.exists():
              warnings = (json.loads(p.read_text()).get("stats") or {}).get("panel_warnings") or []
          print("\n".join("- " + w for w in warnings) if warnings
                else "Nothing to tidy. Every pinned entry is current.")
          PY

      - name: Commit the updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # config/income_groups.json is the cached World Bank classification.
          # It is created on the first run and refreshed each July when they
          # re-classify, so it belongs in the commit alongside the listings.
          git add docs/data/ config/income_groups.json
          if git diff --staged --quiet; then
            echo "No change in listings, nothing to commit."
          else
            git commit -m "data: refresh listings ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - name: Upload data as an artifact for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-data
          path: docs/data/
          retention-days: 7

      # Delivered as a GitHub issue rather than an email sent from here. You
      # are watching your own repository by default, so GitHub emails you the
      # issue, and no SMTP password ever has to live in this repo. Nothing is
      # opened when there is nothing worth saying.
      - name: Send the digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s docs/data/digest.md ] || [ ! -s docs/data/digest_title.txt ]; then
            echo "Nothing new above threshold and nothing closing. Staying quiet."
            exit 0
          fi
          TITLE="$(cat docs/data/digest_title.txt)"
          # Reuse the open digest issue if there is one, so the inbox gets a
          # thread rather than a new issue every six hours.
          EXISTING="$(gh issue list --state open --label jobs-digest \
                       --limit 1 --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file docs/data/digest.md
            gh issue edit "$EXISTING" --title "$TITLE"
            echo "Commented on issue #$EXISTING"
          else
            gh label create jobs-digest --color 0f6d5f \
              --description "Automated job digests" 2>/dev/null || true
            gh issue create --title "$TITLE" \
                            --body-file docs/data/digest.md \
                            --label jobs-digest
          fi

      # Last, on purpose. The board has refreshed and committed by now, so a
      # red run means "something in the code needs looking at", never "you got
      # no listings today".
      - name: Fail the run if the checks failed
        if: steps.checks.outcome == 'failure'
        run: |
          echo "## Checks failed" >> $GITHUB_STEP_SUMMARY
          echo "The listings still refreshed and committed. Open the **Check the pipeline logic** step above to see which assertion broke." >> $GITHUB_STEP_SUMMARY
          exit 1
